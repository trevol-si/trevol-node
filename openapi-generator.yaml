# Configuración de OpenAPI Generator para el SDK de Node/TypeScript (docs/api/43-sdks-y-documentacion.md §2.5).
# La corre sdks/generar.sh sobre sdks/especificacion/openapi.sdk.json. Lo generado va a src/generado/ y no se edita.
generatorName: typescript-fetch
inputSpec: especificacion/openapi.sdk.json
typeMappings:
  # C18: las fechas viajan y se leen como texto, igual que el JSON de la API (sin `Date`).
  date: string
  DateTime: string
additionalProperties:
  # Los campos tal cual los manda la API (`external_id`), no camelCase.
  modelPropertyNaming: original
  paramNaming: camelCase
  supportsES6: true
  stringEnums: true
  useSingleRequestParameter: true
  # C18: en TypeScript el valor nuevo de un enum ya pasa tal cual; la opción metería un valor falso en TODOS los enum.
  enumUnknownDefaultCase: false
  importFileExtension: ".js"
  withInterfaces: false
  typescriptThreePlus: true
  npmName: "@trevol/sdk-generado"
  npmVersion: 0.1.0
  hideGenerationTimestamp: true
  sortParamsByRequiredFlag: true
